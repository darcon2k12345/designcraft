# Builds the launcher natively on Windows (MSVC): patronus-launcher.exe (the window) and
# patronus-launcher-cli.exe (console), and attaches them to a release.
# The release repository is baked in at build time from the repository this workflow runs in,
# so the launcher installs and updates Patronus Design from this repo's releases (nothing can redirect
# it at run time). Run it by hand: Actions > Launcher (Windows) > Run workflow, giving a release tag.
# Unsigned: sign the exe in a follow-up step if you have a code-signing certificate.
name: Launcher (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the launcher to (created if missing), e.g. v0.20.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-latest
    env:
      PATRONUS_RELEASE_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version
      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p patronus-launcher
      - name: Package
        shell: pwsh
        run: |
          $pkg = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'patronus-launcher' }
          New-Item -ItemType Directory -Path dist | Out-Null
          # The window (no console) and the console tool for scripts.
          $gui = "patronus-launcher-$($pkg.version)-windows-x64.exe"
          $cli = "patronus-launcher-cli-$($pkg.version)-windows-x64.exe"
          Copy-Item target/release/patronus-launcher.exe "dist/$gui"
          Copy-Item target/release/patronus-launcher-cli.exe "dist/$cli"
          $lines = foreach ($name in @($gui, $cli)) { "$((Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower())  $name" }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'patronus-launcher-SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          Get-ChildItem dist
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title $env:TAG --notes "" }
          gh release upload $env:TAG (Get-ChildItem dist | ForEach-Object FullName) --clobber
