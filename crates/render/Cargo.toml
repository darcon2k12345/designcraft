[package]
name = "patronusdesign-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Patronus Design renderer: vello_cpu software rasterizer for canvas and exports"

[lints]
workspace = true

[dependencies]
patronusdesign-geom = { workspace = true }
patronusdesign-color = { workspace = true }
patronusdesign-doc = { workspace = true }
patronusdesign-fonts = { workspace = true }
patronusdesign-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
bytemuck = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
patronusdesign-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
craft-image-codecs = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png", "gif", "tiff"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
