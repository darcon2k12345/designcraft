[package]
name = "patronusdesign-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Patronus Design engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[features]
# Recovery-writer handshakes for other crates' tests (`patronusdesign_engine::recovery::testing`).
testing = []

[dependencies]
craft-mime = { workspace = true }
craft-print = { workspace = true }
craft-docpath = { workspace = true }
patronusdesign-images = { workspace = true }
patronusdesign-geom = { workspace = true }
patronusdesign-color = { workspace = true }
patronusdesign-doc = { workspace = true }
patronusdesign-fonts = { workspace = true }
patronusdesign-compose = { workspace = true }
patronusdesign-render = { workspace = true }
patronusdesign-format = { workspace = true }
patronusdesign-epub = { workspace = true }
patronusdesign-pptx = { workspace = true }
patronusdesign-textimport = { workspace = true }
patronusdesign-pdf = { workspace = true }
craft-prepress = { workspace = true }
patronusdesign-tools = { workspace = true }
patronusdesign-idml = { workspace = true }
craft-file-formats = { workspace = true }
craft-csv = { workspace = true }
craft-indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craft-xml = { workspace = true }
craft-svg = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }
# Content hashes of linked files (`asset_io::content_hash`).
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
patronusdesign-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
